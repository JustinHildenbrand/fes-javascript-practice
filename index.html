<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="app.js" defer></script>
  </head>
  <body>
    <h2>Math</h2>
    <h3>Addition</h3>
    <form>
      <label for="add_val_1">First Value: </label>
      <input
        type="number"
        id="add_val_1"
        name="add_val_1"
        onkeyup="formChangedAddition()"
        onchange="formChangedAddition()"
      /><br />
      <label for="add_val_2">Second Value: </label>
      <input
        type="number"
        id="add_val_2"
        name="add_val_2"
        onkeyup="formChangedAddition()"
        onchange="formChangedAddition()"
      /><br /><br />
      <label name="sum" for="add_val_1 add_val_2"
        ><span id="add_val_1_out"></span> + <span id="add_val_2_out"></span> =
      </label>
      <output id="sum_calc"></output>
    </form>
    <h3>Hours to Seconds</h3>
    <form>
      <label for="hours_to_seconds">Hours: </label>
      <input
        type="number"
        id="hours_to_seconds"
        name="hours_to_seconds"
        onkeyup="formChangedHoursToSeconds()"
        onchange="formChangedHoursToSeconds()"
      /><br />
      <label name="seconds" for="hours_to_seconds">Seconds = </label>
      <output id="hours_to_seconds_out"></output>
    </form>
    <h2>Strings</h2>
    <h3>Concatenate Strings</h3>
    <form>
      <label for="concat_str_1">String 1: </label>
      <input
        type="text"
        id="concat_str_1"
        name="concat_str_1"
        onkeyup="formChangedConcat()"
        onchange="formChangedConcat()"
      /><br />
      <label for="concat_str_2">String 2: </label>
      <input
        type="text"
        id="concat_str_2"
        name="concat_str_2"
        onkeyup="formChangedConcat()"
        onchange="formChangedConcat()"
      /><br />
      <label name="concatenate" for="concat_str_out"
        >Concatenated string:
      </label>
      <output id="concat_str_out"></output>
    </form>
    <h2>User Information</h2>
    <p>Username: <span class="name"></span></p>
    <p>Email: <span class="email"></span></p>
  </body>
</html>
