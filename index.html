<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="app.js" defer></script>
  </head>
  <body>
    <h2>Math</h2>
    <h3>Basic</h3>
    <form>
      <label for="val_1">First Value: </label>
      <input
        type="number"
        id="val_1"
        name="val_1"
        onkeyup="formChangedMath()"
        onchange="formChangedMath()"
      /><br />
      <label for="operator">Operator</label>
      <select
        id="operator"
        onkeyup="formChangedMath()"
        onchange="formChangedMath()"
      >
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="%">%</option>
        <option value="^">^</option></select
      ><br />
      <label for="val_2">Second Value: </label>
      <input
        type="number"
        id="val_2"
        name="val_2"
        onkeyup="formChangedMath()"
        onchange="formChangedMath()"
      /><br />
      <label name="result" for="math_out"
        ><span id="val_1_out"></span> <span id="operator_out"> </span>
        <span id="val_2_out"></span> =
      </label>
      <output id="math_out"></output>
    </form>
    <h3>Hours to Seconds</h3>
    <form>
      <label for="hours_to_seconds">Hours: </label>
      <input
        type="number"
        id="hours_to_seconds"
        name="hours_to_seconds"
        onkeyup="formChangedHoursToSeconds()"
        onchange="formChangedHoursToSeconds()"
      /><br />
      <label name="seconds" for="hours_to_seconds">Seconds = </label>
      <output id="hours_to_seconds_out"></output>
    </form>
    <h2>Strings</h2>
    <h3>Concatenate Strings</h3>
    <form>
      <label for="concat_str_1">String 1: </label>
      <input
        type="text"
        id="concat_str_1"
        name="concat_str_1"
        onkeyup="formChangedConcat()"
        onchange="formChangedConcat()"
      /><br />
      <label for="concat_str_2">String 2: </label>
      <input
        type="text"
        id="concat_str_2"
        name="concat_str_2"
        onkeyup="formChangedConcat()"
        onchange="formChangedConcat()"
      /><br />
      <label name="concatenate" for="concat_str_out"
        >Concatenated string:
      </label>
      <output id="concat_str_out"></output>
    </form>
    <h2>User Information</h2>
    <p>Username: <span class="name"></span></p>
    <p>Email: <span class="email"></span></p>
  </body>
</html>
